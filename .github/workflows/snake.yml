name: Generate Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: '21 1 * * *'
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate SVGs for dark and light modes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: noval110
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#9C3155
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E580A2

      - name: Publish the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
