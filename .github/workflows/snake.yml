name: Generate Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: '21 1 * * *'
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate SVGs for dark and light modes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: noval110
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#DB2777&color_dots=#ebedf0,#fbcfe8,#f472b6,#db2777,#9d174d
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F472B6&color_dots=#161b22,#4a1d36,#831843,#db2777,#f9a8d4

      - name: Publish the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
