<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 190" width="1100" height="190" role="img" aria-labelledby="title"><title id="title">SkillMatch project artwork</title>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2c111f"/><stop offset="1" stop-color="#3f182c"/></linearGradient>
<pattern id="p" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#da88b1" opacity=".12"/></pattern>
<clipPath id="c"><rect width="1100" height="190" rx="16"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="1100" height="190" fill="url(#g)"/>
<rect width="1100" height="190" fill="url(#p)"/>
<rect x="0" y="0" width="5" height="190" fill="#ffa8d4"/>
<text x="38" y="38" fill="#ffa8d4" font-family="Arial, sans-serif" letter-spacing="2.6" font-size="13" font-weight="700">03  /  COMMUNITY / LEARNING</text>
<text x="35" y="106" fill="#fff4fa" font-family="Arial, sans-serif" font-size="53" font-weight="750" letter-spacing="-1.5">SkillMatch</text>
<text x="39" y="142" fill="#d7a4be" font-family="Arial, sans-serif" font-size="17">Exchange skills • find complementary strengths</text>
<path d="M38 164 H475" stroke="#ffa8d4" opacity=".45"/>
<path d="M632 25 V166" stroke="#9e5c7d" opacity=".25"/>

<path d="M778 56 L896 92 L778 128 M896 92 L999 56 M896 92 L999 128" fill="none" stroke="#ffa8d4" stroke-width="2" opacity=".55"/>

<!-- Two subtle moving signals visualize reciprocal skill exchange -->
<circle class="motion" r="4.3" fill="#ffd3e9">
  <animateMotion path="M778 56 L896 92 L999 128" dur="6.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.8;1" dur="6.8s" repeatCount="indefinite"/>
</circle>
<circle class="motion" r="3.6" fill="#ee8ebe">
  <animateMotion path="M999 56 L896 92 L778 128" dur="7.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.2;.8;1" dur="7.8s" repeatCount="indefinite"/>
</circle>
<circle cx="777" cy="56" r="24" fill="#5c2641" stroke="#ffa8d4" stroke-width="2"/>
<circle cx="777" cy="128" r="24" fill="#5c2641" stroke="#ffa8d4" stroke-width="2"/>
<circle cx="896" cy="92" r="31" fill="#ffa8d4" fill-opacity=".16" stroke="#ffa8d4" stroke-width="2">
  <animate attributeName="stroke-opacity" values=".65;1;.65" dur="5.5s" repeatCount="indefinite"/>
</circle>
<circle cx="1000" cy="56" r="22" fill="#5c2641" stroke="#ffa8d4" stroke-width="2"/>
<circle cx="1000" cy="128" r="22" fill="#5c2641" stroke="#ffa8d4" stroke-width="2"/>
<path d="M766 56 H788 M777 45 V67 M766 128 H788 M987 56 H1013 M989 128 H1011" stroke="#ffdcee" stroke-width="2" stroke-linecap="round"/>
<text x="896" y="98" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#ffeef6">↔</text>

<style>
@media (prefers-reduced-motion: reduce) { .motion { display:none } }
</style>
<text x="1063" y="166" text-anchor="end" font-family="Arial, sans-serif" fill="#925172" font-size="13" letter-spacing="2">NOVAL / SELECTED WORK</text>
</g></svg>