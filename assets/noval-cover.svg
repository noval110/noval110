<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="cover-title cover-description">
  <title id="cover-title">NOVAL — minimal animated developer portfolio cover</title>
  <desc id="cover-description">An elegant midnight navy cover with NOVAL typography, restrained cyan accents, orbiting light points and a gently moving signal line.</desc>
  <defs>
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1A"/>
      <stop offset="60%" stop-color="#0A1726"/>
      <stop offset="100%" stop-color="#0E2334"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67D6DA" stop-opacity=".12"/>
      <stop offset="65%" stop-color="#478CBB" stop-opacity=".035"/>
      <stop offset="100%" stop-color="#478CBB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FEADD"/>
      <stop offset="100%" stop-color="#74B8E7"/>
    </linearGradient>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="bound"><rect width="1200" height="410" rx="18"/></clipPath>
    <style>
      .orbit-main{animation:orbit-main 28s linear infinite;transform-origin:982px 205px}
      .orbit-inner{animation:orbit-inner 19s linear infinite reverse;transform-origin:982px 205px}
      .signal{stroke-dasharray:70 440;animation:signal 8s ease-in-out infinite}
      .breathe{animation:breathe 6s ease-in-out infinite}
      .pulse{animation:pulse 4.5s ease-in-out infinite}
      @keyframes orbit-main{to{transform:rotate(360deg)}}
      @keyframes orbit-inner{to{transform:rotate(360deg)}}
      @keyframes signal{0%{stroke-dashoffset:520;opacity:.05}40%{opacity:.85}100%{stroke-dashoffset:0;opacity:.05}}
      @keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}
      @media (prefers-reduced-motion:reduce){.orbit-main,.orbit-inner,.signal,.breathe,.pulse{animation:none!important}}
    </style>
  </defs>

  <g clip-path="url(#bound)">
    <rect width="1200" height="410" fill="url(#navy)"/>
    <circle cx="982" cy="205" r="300" fill="url(#aura)" class="breathe"/>
    <path d="M46 76H1154" fill="none" stroke="#A3C1CE" stroke-opacity=".13" stroke-width="1"/>
    <path d="M46 349H1154" fill="none" stroke="#A3C1CE" stroke-opacity=".13" stroke-width="1"/>

    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="70" y="35" width="25" height="25" rx="6" fill="none" stroke="#83DCD7" stroke-width="1.3"/>
      <text x="82.5" y="53" text-anchor="middle" font-size="15" font-weight="700" fill="#DFF8F5">N</text>
      <text x="108" y="53" font-size="12" font-weight="700" letter-spacing="2.5" fill="#CBD8E6">NOVAL / 110</text>
      <text x="1129" y="52" text-anchor="end" font-size="11" letter-spacing="2.5" fill="#88A4B8">PERSONAL WORKSPACE  /  2026</text>

      <text x="70" y="155" font-size="13" letter-spacing="3.2" font-weight="700" fill="#86DAD6">FULL-STACK DEVELOPMENT  /  EXPLORING AI</text>
      <text x="64" y="255" font-size="112" letter-spacing="-6" font-weight="700" fill="#F2F7FA">NOVAL</text>
      <circle cx="457" cy="238" r="8" fill="#79D9D6" class="pulse"/>
      <text x="72" y="296" font-size="24" fill="#BECFDC">Building ideas into useful software.</text>
      <path d="M73 322H523" stroke="#5A8496" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/>
      <path class="signal" d="M73 322H523" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>

      <text x="70" y="380" font-size="11" letter-spacing="2.6" fill="#8DA8BA">REACT   /   GO   /   PYTHON   /   POSTGRESQL</text>
      <text x="1129" y="380" text-anchor="end" font-size="11" letter-spacing="2.4" fill="#809CAF">DESIGN + CODE + CURIOSITY</text>
    </g>

    <g fill="none" stroke="#80BAC7" stroke-width="1">
      <circle cx="982" cy="205" r="170" stroke-opacity=".2"/>
      <circle cx="982" cy="205" r="125" stroke-opacity=".19"/>
      <circle cx="982" cy="205" r="78" stroke-opacity=".16"/>
      <path d="M812 205H1152M982 35V375" stroke-opacity=".06"/>
    </g>

    <g class="orbit-main">
      <circle cx="1152" cy="205" r="12" fill="#70E0D8" opacity=".33" filter="url(#soft-glow)"/>
      <circle cx="1152" cy="205" r="4.3" fill="#99F5EC"/>
    </g>
    <g class="orbit-inner">
      <circle cx="1107" cy="205" r="7" fill="#93B8F9" opacity=".25" filter="url(#soft-glow)"/>
      <circle cx="1107" cy="205" r="2.8" fill="#9DDBF2"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif">
      <circle cx="982" cy="205" r="43" fill="#102637" stroke="#7CC9D0" stroke-opacity=".34" stroke-width="1"/>
      <text x="982" y="216" font-size="32" font-weight="700" text-anchor="middle" fill="#DDF0F2">N</text>
      <path d="M958 228H1006" fill="none" stroke="#6DCCD0" stroke-opacity=".5"/>
    </g>
  </g>
</svg>